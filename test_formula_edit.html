<!DOCTYPE html>
<html>
<head>
    <title>Test Formula Editing</title>
</head>
<body>
    <h1>Test Formula Editing</h1>
    <p>Open browser console and check the logs</p>
    <script>
        async function testRawValue() {
            const response = await fetch('http://localhost:8080/api/cell/raw?row=0&col=1');
            const rawValue = await response.json();
            console.log('Raw value type:', typeof rawValue);
            console.log('Raw value:', rawValue);
            console.log('Raw value JSON:', JSON.stringify(rawValue));
        }
        testRawValue();
    </script>
</body>
</html>
