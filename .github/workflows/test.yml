name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Go dependencies
      run: go mod download

    - name: Install system dependencies for Electron
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libasound2t64 \
          xvfb

    - name: Install Node dependencies
      run: npm ci

    - name: Lint (JS/CSS)
      run: |
        npm run lint
        npm run format:check

    - name: Lint (Go)
      uses: golangci/golangci-lint-action@v6
      with:
        version: v2.11.2

    - name: Complexity (report only, does not fail)
      run: make complexity || true

    - name: Build Go server
      run: make build

    - name: Run Go unit tests
      run: go test -v ./model/... ./controller/... ./api/...

    - name: Coverage (report only)
      run: make coverage || true

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: coverage-report
        path: coverage.out
        retention-days: 7

    - name: Run Playwright Electron tests
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test --project=electron
      env:
        NODE_ENV: test
        ELECTRON_SHOW_WINDOW: 1
        DEBUG: pw:api

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload test traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        retention-days: 30
