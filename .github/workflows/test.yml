name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Go dependencies
      run: go mod download
    
    - name: Install system dependencies for Electron
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libatk1.0-0 \
          libatk-bridge2.0-0 \
          libcups2 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libasound2 \
          xvfb
    
    - name: Install Node dependencies
      run: npm ci
    
    - name: Install Playwright browsers with system dependencies
      run: npx playwright install --with-deps chromium
    
    - name: Build Go server
      run: |
        cd server
        go build -o gosheet-server main.go
        cd ..
    
    - name: Run Go unit tests
      run: go test -v ./tests/...
    
    - name: Run Playwright Electron tests
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm test
      env:
        NODE_ENV: test
        DEBUG: pw:api
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Upload test traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        retention-days: 30
