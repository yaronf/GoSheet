openapi: 3.0.3
info:
  title: GoSheet API
  description: |
    HTTP API for GoSheet spreadsheet application.

    ## Authentication

    All `/api/*` endpoints require a bearer token. Two token types are in use:

    **Bootstrap token** (`BootstrapAuth`): Generated by the Go server at startup using a 32-byte
    CSPRNG (base64url encoded). Written to fd 3 alongside the port number. Electron injects it into
    the renderer, which sends it as `Authorization: Bearer <token>` on every request. Has full
    access to all endpoints. In `NODE_ENV=test` mode the server skips token generation and auth is
    disabled entirely so Playwright tests run without modification.

    **Agent token** (`AgentAuth`): Scoped token (`ro` or `rw`) issued by `POST /api/agent/token`
    in exchange for a valid bootstrap token. Used exclusively by AI agents. Agent tokens are
    rejected on `/api/file/*` endpoints regardless of scope. Read-only (`ro`) tokens are rejected
    on any mutating agent endpoint.

    The bootstrap endpoint (`GET /api/agent/bootstrap`) also accepts the agent token as a
    `?token=` query parameter for copy-paste UX when the user hands a URL to an agent.
  version: 1.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Relative to host (localhost ephemeral port)

# All /api/* endpoints require auth. Static file routes are unauthenticated.
# In NODE_ENV=test the server disables auth entirely (bootstrapToken == "").
security:
  - BootstrapAuth: []

components:
  securitySchemes:
    BootstrapAuth:
      type: http
      scheme: bearer
      description: |
        Bootstrap token generated at server startup. Injected into the Electron renderer via URL
        query param and forwarded as `Authorization: Bearer <token>` on every API request.
        Has full access to all endpoints including `/api/file/*`.
    AgentAuth:
      type: http
      scheme: bearer
      description: |
        Scoped agent token issued by `POST /api/agent/token`. Used by AI agents.
        Scope `rw` allows reads and writes; scope `ro` allows reads only.
        Rejected on `/api/file/*` endpoints regardless of scope.

  schemas:
    ErrorResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code (e.g. INVALID_CELL_REF, FILE_NOT_FOUND)
    ApiResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string
        code:
          type: string
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
    PathRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    SetCellRequest:
      type: object
      required: [row, col, value]
      properties:
        row:
          type: integer
        col:
          type: integer
        value:
          type: string
    CellValueResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                computed:
                  type: string
    CellRawResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                value:
                  type: string
    SetCellResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                value:
                  type: string
                displayValue:
                  type: string
                isFormula:
                  type: boolean
                hasUnsavedChanges:
                  type: boolean
    CellData:
      type: object
      properties:
        row:
          type: integer
        col:
          type: integer
        computed:
          type: string
        value:
          type: string
    AllCellsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CellData'
    SaveLoadResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            path:
              type: string
    FileStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                path:
                  type: string
                saved:
                  type: boolean
                modified:
                  type: boolean
                hasUnsavedChanges:
                  type: boolean
                filename:
                  type: string
    CSVPreviewResponse:
      type: object
      properties:
        success:
          type: boolean
        rows:
          type: integer
        cols:
          type: integer
        preview:
          type: array
          items:
            type: array
            items:
              type: string
        error:
          type: string
        code:
          type: string
    CSVImportResponse:
      type: object
      properties:
        success:
          type: boolean
        rows:
          type: integer
        cols:
          type: integer
        message:
          type: string
        error:
          type: string
        code:
          type: string
    CSVExportResponse:
      type: object
      properties:
        success:
          type: boolean
        rows:
          type: integer
        cols:
          type: integer
        message:
          type: string
        error:
          type: string
        code:
          type: string
    MergeRegion:
      type: object
      required: [startRow, startCol, rowSpan, colSpan]
      properties:
        startRow:
          type: integer
        startCol:
          type: integer
        rowSpan:
          type: integer
        colSpan:
          type: integer
    SetMergeRequest:
      type: object
      required: [startRow, startCol, rowSpan, colSpan]
      properties:
        startRow:
          type: integer
        startCol:
          type: integer
        rowSpan:
          type: integer
        colSpan:
          type: integer
    UnmergeRequest:
      type: object
      required: [startRow, startCol]
      properties:
        startRow:
          type: integer
        startCol:
          type: integer
    MergesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                merges:
                  type: array
                  items:
                    $ref: '#/components/schemas/MergeRegion'
    SetMergeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                hasUnsavedChanges:
                  type: boolean
    UnmergeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                hasUnsavedChanges:
                  type: boolean
    ShiftFormulaRequest:
      type: object
      required: [formula, row_offset, col_offset]
      properties:
        formula:
          type: string
          example: '=A1+B2'
        row_offset:
          type: integer
        col_offset:
          type: integer
    ShiftFormulaResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                shifted:
                  type: string
                  example: '=B2+D4'
    ApplyCellStyleRequest:
      type: object
      required: [row, col, styleId]
      properties:
        row:
          type: integer
        col:
          type: integer
        styleId:
          type: integer
    ApplyRangeStyleRequest:
      type: object
      required: [startRow, startCol, endRow, endCol, styleId]
      properties:
        startRow:
          type: integer
        startCol:
          type: integer
        endRow:
          type: integer
        endCol:
          type: integer
        styleId:
          type: integer
    ApplyStyleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                hasUnsavedChanges:
                  type: boolean

    # ── Agent schemas (Epic 20) ───────────────────────────────────────────────

    AgentScope:
      type: string
      enum: [ro, rw]
      description: |
        `ro` — read-only (GET agent endpoints only).
        `rw` — read + write (all agent endpoints).

    AgentTokenRequest:
      type: object
      required: [scope]
      properties:
        scope:
          $ref: '#/components/schemas/AgentScope'

    AgentTokenResponse:
      type: object
      required: [success, agentToken, agentId]
      properties:
        success:
          type: boolean
        agentToken:
          type: string
          description: Opaque bearer token for the agent to use on all subsequent calls.
        agentId:
          type: string
          description: Human-readable session identifier (e.g. `agt_a1b2c3d4`).

    AgentSessionStatus:
      type: object
      required: [success, active]
      properties:
        success:
          type: boolean
        active:
          type: boolean
        agentId:
          type: string
        scope:
          $ref: '#/components/schemas/AgentScope'

    AgentWorkbookDimensions:
      type: object
      properties:
        rows:
          type: integer
        cols:
          type: integer
        usedRange:
          type: string
          description: A1 notation bounding box of non-empty cells (e.g. `A1:D10`).

    AgentWorkbook:
      type: object
      required: [filePath, cellCount, dimensions, modified]
      properties:
        filePath:
          type: string
        cellCount:
          type: integer
        dimensions:
          $ref: '#/components/schemas/AgentWorkbookDimensions'
        modified:
          type: boolean

    AgentWorkbookResponse:
      type: object
      required: [success, workbook]
      properties:
        success:
          type: boolean
        workbook:
          $ref: '#/components/schemas/AgentWorkbook'

    AgentCellEntry:
      type: object
      required: [row, col, ref, raw, computed, isFormula, styleId, alignment]
      properties:
        row:
          type: integer
        col:
          type: integer
        ref:
          type: string
          description: A1 notation cell reference (e.g. `B3`).
        raw:
          type: string
          description: Raw value or formula string (e.g. `=A1+1` or `hello`).
        computed:
          type: string
          description: Evaluated string value.
        isFormula:
          type: boolean
        styleId:
          type: integer
        alignment:
          type: string
          enum: ['', left, center, right]

    AgentRangeResponse:
      type: object
      required: [success, range, cells]
      properties:
        success:
          type: boolean
        range:
          type: string
          description: The range that was queried (echoed back).
        cells:
          type: array
          items:
            $ref: '#/components/schemas/AgentCellEntry'

    AgentPatchOp:
      type: object
      required: [op]
      description: |
        One operation in a patch batch. Supported `op` values:
        - `SetCell` — requires `row`, `col`, `value`
        - `ClearRange` — requires `startRow`, `startCol`, `endRow`, `endCol`
        - `InsertRow` — requires `row`
        - `DeleteRow` — requires `row`
        - `InsertColumn` — requires `col`
        - `DeleteColumn` — requires `col`
        - `SetStyle` — requires `row`, `col`; optional `styleId`, `alignment`
        - `AddStyle` — requires `name`; optional `fontColor`, `fillColor`
        - `ClearFormat` — requires `startRow`, `startCol`, `endRow`, `endCol`
      properties:
        op:
          type: string
          enum: [SetCell, ClearRange, InsertRow, DeleteRow, InsertColumn, DeleteColumn, SetStyle, AddStyle, ClearFormat]
        row:
          type: integer
        col:
          type: integer
        startRow:
          type: integer
        startCol:
          type: integer
        endRow:
          type: integer
        endCol:
          type: integer
        value:
          type: string
        styleId:
          type: integer
        alignment:
          type: string
          enum: ['', left, center, right]
        name:
          type: string
          description: Style name (for AddStyle).
        fontColor:
          type: string
          description: Hex color string, e.g. `#FF0000` (for AddStyle).
        fillColor:
          type: string
          description: Hex color string, e.g. `#FFFF00` (for AddStyle).

    AgentPatchRequest:
      type: object
      required: [ops]
      properties:
        description:
          type: string
          description: Human-readable description recorded in the audit log only.
        ops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AgentPatchOp'

    AgentPatchResponse:
      type: object
      required: [success, opsCount]
      properties:
        success:
          type: boolean
        opsCount:
          type: integer
        failingOpIdx:
          type: integer
          description: Index of the first failing op (only present on 400 responses).
        error:
          type: string

    AgentToolDefinition:
      type: object
      required: [name, description, input_schema]
      description: OpenAI function calling schema compatible tool definition.
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          description: JSON Schema describing the tool's input parameters.

    AgentBootstrapResponse:
      type: object
      required: [success, session, workbook, tools]
      properties:
        success:
          type: boolean
        session:
          type: object
          required: [agentId, scope, baseUrl]
          properties:
            agentId:
              type: string
            scope:
              $ref: '#/components/schemas/AgentScope'
            baseUrl:
              type: string
              description: Base URL for all subsequent API calls (e.g. `http://localhost:49213`).
        workbook:
          $ref: '#/components/schemas/AgentWorkbook'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolDefinition'

paths:
  /api/cell/value:
    get:
      operationId: getCellValue
      summary: Get cell computed value
      parameters:
        - name: row
          in: query
          required: true
          schema:
            type: integer
        - name: col
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cell value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellValueResponse'
        '400':
          description: Bad request (invalid or missing row/col)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cell/raw:
    get:
      operationId: getCellRaw
      summary: Get cell raw value (formula or text)
      parameters:
        - name: row
          in: query
          required: true
          schema:
            type: integer
        - name: col
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cell raw value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellRawResponse'
        '400':
          description: Bad request (invalid or missing row/col)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cell/set:
    post:
      operationId: setCellValue
      summary: Set cell value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCellRequest'
      responses:
        '200':
          description: Cell updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetCellResponse'
        '400':
          description: Bad request (invalid body, missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (agent token with ro scope, or agent token on file endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error (e.g. circular ref, invalid formula)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cell/ref:
    get:
      operationId: getCellRef
      summary: Get cell reference (e.g. A1)
      parameters:
        - name: row
          in: query
          required: true
          schema:
            type: integer
        - name: col
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cell reference string
          content:
            application/json:
              schema:
                type: string
                example: '"A1"'
        '400':
          description: Bad request (invalid or missing row/col)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/merges:
    get:
      operationId: getMerges
      summary: Get all merge regions
      responses:
        '200':
          description: Merge regions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/merge:
    post:
      operationId: setMerge
      summary: Create merge region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMergeRequest'
      responses:
        '200':
          description: Merge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetMergeResponse'
        '400':
          description: Bad request (overlap, invalid bounds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (agent token with ro scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/unmerge:
    post:
      operationId: unmerge
      summary: Remove merge region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnmergeRequest'
      responses:
        '200':
          description: Merge removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnmergeResponse'
        '400':
          description: Bad request (anchor not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cell/style:
    post:
      operationId: applyCellStyle
      summary: Apply style to a single cell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCellStyleRequest'
      responses:
        '200':
          description: Style applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyStyleResponse'
        '400':
          description: Bad request (invalid row/col/styleId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (agent token with ro scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/range/style:
    post:
      operationId: applyRangeStyle
      summary: Apply style to a range of cells
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRangeStyleRequest'
      responses:
        '200':
          description: Style applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyStyleResponse'
        '400':
          description: Bad request (invalid range/styleId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (agent token with ro scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/format/cleanup:
    post:
      operationId: formatCleanup
      summary: Remove style from empty cells and delete cells with no value and no style
      responses:
        '200':
          description: Cleanup completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyStyleResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed (POST required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cells/all:
    get:
      operationId: getAllCells
      summary: Get all non-empty cells
      responses:
        '200':
          description: Array of cell data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllCellsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/file/save:
    post:
      operationId: saveFile
      summary: Save spreadsheet to file
      description: Requires bootstrap token. Agent tokens are rejected on all `/api/file/*` endpoints.
      security:
        - BootstrapAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathRequest'
      responses:
        '200':
          description: File saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveLoadResponse'
        '400':
          description: Bad request (missing path)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (agent tokens cannot perform file operations)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error (e.g. file write error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/file/load:
    post:
      operationId: loadFile
      summary: Load spreadsheet from file
      description: Requires bootstrap token. Agent tokens are rejected on all `/api/file/*` endpoints.
      security:
        - BootstrapAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathRequest'
      responses:
        '200':
          description: File loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveLoadResponse'
        '400':
          description: Bad request (missing path)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
