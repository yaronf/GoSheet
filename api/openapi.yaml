  # ── Agent endpoints (Epic 20) ──────────────────────────────────────────────

  /api/agent/token:
    post:
      operationId: issueAgentToken
      summary: Issue a scoped agent token
      description: |
        Exchanges the bootstrap token for a scoped agent token. Only one agent session
        may be active per file at a time — a second call returns 409 while a session is active.
      security:
        - BootstrapAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTokenRequest'
      responses:
        '200':
          description: Agent token issued, session opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenResponse'
        '400':
          description: Bad request (invalid scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (missing or invalid bootstrap token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — an agent session is already active for this file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/bootstrap:
    get:
      operationId: agentBootstrap
      summary: Agent entry point — returns tool definitions and workbook context
      description: |
        The single URL handed to an AI agent. Returns everything needed to start working:
        validated token confirmation, tool definitions in OpenAI function calling schema,
        workbook summary, and session metadata.

        Uniquely, this endpoint accepts the agent token as a `?token=` query parameter
        in addition to the `Authorization: Bearer` header, enabling copy-paste UX.
      security:
        - AgentAuth: []
      parameters:
        - name: token
          in: query
          required: false
          description: Agent token (alternative to Authorization header for copy-paste UX).
          schema:
            type: string
      responses:
        '200':
          description: Bootstrap data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBootstrapResponse'
        '401':
          description: Unauthorized (missing or invalid agent token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/workbook:
    get:
      operationId: getAgentWorkbook
      summary: Get workbook summary (file path, dimensions, cell count)
      description: Accessible with ro or rw scope.
      security:
        - AgentAuth: []
      responses:
        '200':
          description: Workbook summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWorkbookResponse'
        '401':
          description: Unauthorized (missing or invalid agent token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/range:
    get:
      operationId: getAgentRange
      summary: Read cells in an A1-notation range
      description: |
        Returns raw value, computed value, formula flag, styleId, and alignment for every cell
        in the range. Empty cells are included with empty string values for predictable indexing.
        Maximum 10,000 cells per request.
      security:
        - AgentAuth: []
      parameters:
        - name: range
          in: query
          required: true
          description: A1 range notation, e.g. `A1:D10` or single cell `B3`.
          schema:
            type: string
      responses:
        '200':
          description: Cell data for the requested range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRangeResponse'
        '400':
          description: Bad request (missing range param, invalid notation, range too large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/patch:
    post:
      operationId: agentPatch
      summary: Apply a batch of operations atomically
      description: |
        All ops are validated before any are executed. If any op is invalid the entire
        batch is rejected (no partial apply). Requires rw scope.
      security:
        - AgentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPatchRequest'
      responses:
        '200':
          description: Patch applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPatchResponse'
        '400':
          description: Validation failure — patch rejected atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPatchResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (ro scope token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/commit:
    post:
      operationId: agentCommit
      summary: Checkpoint — collapse agent history into a single user undo entry
      description: |
        All agent operations since the last commit (or session open) are collapsed into a
        single `AgentCommitCommand` and transferred to the user's undo history. The token
        remains active; a new history marker is effectively set.
      security:
        - AgentAuth: []
      responses:
        '200':
          description: Commit successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/end:
    post:
      operationId: agentEnd
      summary: End the agent session cleanly, revoking the token
      description: |
        Any uncommitted agent history since the last commit is collapsed into the user's
        undo history. The token is revoked. The spreadsheet is marked as having unsaved changes.
      security:
        - AgentAuth: []
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/rollback:
    post:
      operationId: agentRollback
      summary: Discard all agent changes and end the session
      description: |
        Drains the agent history back to the session-open marker (or last commit checkpoint)
        by replaying `Undo()` calls in reverse order. The token is revoked. No changes are
        transferred to the user's undo history.
      security:
        - AgentAuth: []
      responses:
        '200':
          description: Rollback successful, session ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/session/status:
    get:
      operationId: getAgentSessionStatus
      summary: Get current agent session status
      description: Returns whether a session is active and its metadata. Requires bootstrap token.
      security:
        - BootstrapAuth: []
      responses:
        '200':
          description: Session status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/agent/session/end:
    post:
      operationId: adminEndAgentSession
      summary: Forcibly end any active agent session (admin/UI use)
      description: |
        Ends the active session without requiring the agent token — intended for the UI
        "End Session" button which only has the bootstrap token. Any uncommitted agent
        history is collapsed into the user's undo history. No-op if no session is active.
      security:
        - BootstrapAuth: []
      responses:
        '200':
          description: Session ended (or was already inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events:
    get:
      operationId: subscribeEvents
      summary: Subscribe to server-sent events (SSE)
      description: |
        Long-lived SSE connection streaming push notifications from the Go server.
        Event types: `cells_changed` (after agent patch), `session_changed` (after
        agent session start/end/rollback). Auth via `?token=` query param because
        EventSource cannot set Authorization headers. Browser-native auto-reconnect.
      tags:
        - Events
      security:
        - BootstrapAuth: []
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: Bootstrap token (EventSource cannot set headers)
      responses:
        '200':
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed (GET only)
