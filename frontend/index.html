<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoSheet - Untitled</title>
    <!-- Pico.css - Foundation layer for base styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Custom styles - Override Pico defaults -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="spreadsheet.css">
</head>
<body>
    <div id="app"></div>
    <!-- Story 10.8: Set __DEBUG__ before modules load (web: ?debug=1, Electron: from preload) -->
    <script>
      window.__DEBUG__ = window.__DEBUG__ || (typeof location !== 'undefined' && location.search.includes('debug=1'));
    </script>
    <!-- ES6 modules -->
    <script type="module" src="api-client.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
