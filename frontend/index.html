<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy: suppress Electron CSP warning; allow CDN for Pico.css -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; connect-src http://localhost:* ws://localhost:*; img-src 'self' data:">
    <title>GoSheet - Untitled</title>
    <!-- Pico.css - Foundation layer for base styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- Custom styles - Override Pico defaults -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="spreadsheet.css">
</head>
<body>
    <div id="app"></div>
    <!-- Story 10.8: Set __DEBUG__ before modules load (web: ?debug=1, Electron: from preload) -->
    <!-- Story 20.1: Bootstrap token passed via ?token= query param by Electron main process -->
    <script>
      window.__DEBUG__ = window.__DEBUG__ || (typeof location !== 'undefined' && location.search.includes('debug=1'));
      (function() {
        const p = new URLSearchParams(typeof location !== 'undefined' ? location.search : '');
        const t = p.get('token');
        if (t) window.__GOSHEET_TOKEN__ = t;
      })();
    </script>
    <!-- ES6 modules -->
    <script type="module" src="api-client.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
