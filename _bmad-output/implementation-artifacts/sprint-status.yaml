  #   application-level context or instructions to the agent — only session, workbook summary, and tool schemas.
  #   A calling LLM has no system prompt, no behavioral constraints (always commit when done, rollback on error),
  #   no scope semantics explanation, and no formula syntax hints.
  #   Fix: add an "instructions" field to the bootstrap response, returned by getAgentInstructions(scope string).
